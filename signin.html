```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | NurseHub</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="signin.css">
</head>

<body>

    <div class="signin-container card shadow-lg p-4">

        <a href="index.html" class="logo">
            Nurse<span>Hub</span>
        </a>

        <h2>Create Account</h2>
        <p class="subtitle">Join NurseHub today</p>

        <form action="#" method="post" class="row g-3">

            <div class="col-12">
                <label for="fullname" class="form-label">Full Name</label>
                <input type="text"
                       id="fullname"
                       name="fullname"
                       class="form-control"
                       placeholder="Enter your full name"
                       autocomplete="name"
                       required>
            </div>

            <div class="col-12">
                <label for="email" class="form-label">Email Address</label>
                <input type="email"
                       id="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter your email"
                       autocomplete="email"
                       required>
            </div>

            <div class="col-12">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel"
                       id="phone"
                       name="phone"
                       class="form-control"
                       placeholder="Enter your phone number"
                       autocomplete="tel"
                       required>
            </div>

            <div class="col-12">
                <label for="password" class="form-label">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       placeholder="Create a password"
                       autocomplete="new-password"
                       required>
            </div>

            <div class="col-12">
                <label for="confirm-password" class="form-label">
                    Confirm Password
                </label>
                <input type="password"
                       id="confirm-password"
                       name="confirm-password"
                       class="form-control"
                       placeholder="Confirm your password"
                       autocomplete="new-password"
                       required>
            </div>

            <div class="col-12">
                <label for="account-type" class="form-label">
                    Account Type
                </label>

                <select id="account-type"
                        name="account-type"
                        class="form-select"
                        required>
                    <option value="">Select account type</option>
                    <option value="client">Client</option>
                    <option value="nurse">Nurse</option>
                </select>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary w-100">
                    Create Account
                </button>
            </div>

        </form>

        <p class="signin-link">
            Already have an account?
            <a href="login.html">Sign In</a>
        </p>

        <a href="index.html" class="home-link">Back to Home</a>

    </div>

    <script>
        // Select account type automatically from the URL
        const accountType = document.getElementById("account-type");
        const urlParams = new URLSearchParams(window.location.search);
        const selectedType = urlParams.get("type");

        if (selectedType === "client" || selectedType === "nurse") {
            accountType.value = selectedType;
        }

        // Check whether both passwords match
        const signupForm = document.querySelector("form");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirm-password");

        signupForm.addEventListener("submit", function (event) {
            if (password.value !== confirmPassword.value) {
                event.preventDefault();

                alert("Passwords do not match. Please try again.");

                confirmPassword.focus();
            }
        });
    </script>

</body>
</html>
