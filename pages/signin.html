<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Re3aya</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/signin.css">
</head>
<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6">
        <div class="signin-container card p-4 p-sm-5 text-center text-md-start">

          <a href="../index.html" class="logo">
            Re<span>3aya</span>
          </a>

          <h2>Create Account</h2>
          <p class="subtitle">Join Re3aya for trusted home nursing care</p>

          <form action="../index.html" method="get" class="row g-3">

            <div class="col-12">
              <label for="fullname" class="form-label">Full Name</label>
              <input type="text"
                     id="fullname"
                     name="fullname"
                     class="form-control text-center text-md-start"
                     placeholder="Enter your full name"
                     autocomplete="name"
                     required>
            </div>

            <div class="col-12 col-md-6">
              <label for="email" class="form-label">Email Address</label>
              <input type="email"
                     id="email"
                     name="email"
                     class="form-control text-center text-md-start"
                     placeholder="Enter your email"
                     autocomplete="email"
                     required>
            </div>

            <div class="col-12 col-md-6">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="tel"
                     id="phone"
                     name="phone"
                     class="form-control text-center text-md-start"
                     placeholder="Enter your phone number"
                     autocomplete="tel"
                     required>
            </div>

            <div class="col-12 col-md-6">
              <label for="password" class="form-label">Password</label>
              <input type="password"
                     id="password"
                     name="password"
                     class="form-control text-center text-md-start"
                     placeholder="Create a password"
                     autocomplete="new-password"
                     required>
            </div>

            <div class="col-12 col-md-6">
              <label for="confirm-password" class="form-label">Confirm Password</label>
              <input type="password"
                     id="confirm-password"
                     name="confirm-password"
                     class="form-control text-center text-md-start"
                     placeholder="Confirm your password"
                     autocomplete="new-password"
                     required>
            </div>

            <div class="col-12">
              <label for="account-type" class="form-label">Account Type</label>
              <select id="account-type"
                      name="account-type"
                      class="form-select text-center text-md-start"
                      required>
                <option value="">Select account type</option>
                <option value="client">Client (Patient / Family)</option>
                <option value="nurse">Qualified Nurse</option>
              </select>
            </div>

            <div class="col-12 mt-3">
              <button type="submit" class="btn btn-primary w-100">
                Create Account
              </button>
            </div>

          </form>

          <p class="signin-link mb-2">
            Already have an account?
            <a href="login.html">Sign In</a>
          </p>

          <div class="text-center mt-2">
            <a href="../index.html" class="home-link">
              <i class="fa-solid fa-arrow-left me-1"></i>Back to Home
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>

</body>
</html>
